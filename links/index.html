<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Achadinhos | Links</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', Arial, sans-serif;
        }

        /* FUNDO DA PÁGINA */
        body {
            background-image: url('fundo.jpeg'); 
            background-size: cover;
            background-position: top center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: #000; /* Cor de segurança caso a imagem demore a carregar */
        }

        .container-botoes {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 65vh; /* Distância do topo para não cobrir a mulher */
            padding-bottom: 40px;
        }

        /* ESTILO DOS BOTÕES */
        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #eaeaea;
            border-radius: 50px;
            padding: 10px 20px 10px 10px;
            text-decoration: none;
            color: #333;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.3);
        }

        .btn-icone {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: #25D366;
        }

        .btn-icone svg {
            width: 35px;
            height: 35px;
            fill: #fff;
        }

        .btn-texto {
            flex: 1;
            padding: 0 15px;
            text-align: left;
            line-height: 1.3;
        }

        .btn-texto strong {
            display: block;
            font-size: 18px;
            font-weight: 800;
            color: #111;
        }
        
        .btn-texto strong span {
            color: #25D366;
        }

        .btn-texto small {
            font-size: 13px;
            color: #666;
            font-weight: 500;
        }

        .btn-seta {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #25D366;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .btn-seta svg {
            width: 18px;
            height: 18px;
            fill: #fff;
        }

        /* CORES PERSONALIZADAS */
        /* Instagram */
        .btn.instagram .btn-icone {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }
        .btn.instagram .btn-texto strong span {
            color: #dc2743;
        }
        .btn.instagram .btn-seta {
            background: #dc2743;
        }

        /* Site */
        .btn.site .btn-icone {
            background: #111;
        }
        .btn.site .btn-texto strong span {
            color: #ff6b00;
        }
        .btn.site .btn-seta {
            background: #ff6b00;
        }

        @media (max-width: 480px) {
            .container-botoes {
                margin-top: 55vh;
            }
            .btn-texto strong { font-size: 16px; }
            .btn-texto small { font-size: 11px; }
            .btn-icone { width: 50px; height: 50px; }
            .btn-icone svg { width: 28px; height: 28px; }
        }

        /* ANIMAÇÃO DO POPUP */
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

            </div>

                <strong>Siga nosso<br><span>Instagram</span></strong>
                <small>Fique por dentro das novidades!</small>
            </div>
            <div class="btn-seta">
                <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>

        <!-- BOTÃO SITE -->

            <div class="btn-icone">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>

            <div class="btn-seta">
                <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
            </div>

    </div>

    <!-- ===== POPUP DE GRUPOS WHATSAPP (AUTOMÁTICO VIA SHEETS) ===== -->
    <div id="popupGrupos" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 99999; align-items: center; justify-content: center; backdrop-filter: blur(5px); padding: 15px; font-family: 'Inter', Arial, sans-serif;">
        <div style="background: #fff; width: 100%; max-width: 420px; border-radius: 24px; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.3); animation: slideUp 0.3s ease; display: flex; flex-direction: column; max-height: 90vh;">

                <button onclick="confirmarGrupos()" id="btnConfirmar" disabled style="flex: 2; background: #ccc; color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; transition: background 0.2s;">Confirmar</button>

    <!-- ===== SCRIPT DO POPUP E DA PLANILHA ===== -->
    <script>
        const URL_PLANILHA = "https://docs.google.com/spreadsheets/d/1kz185SYCWeIEcJhWMWcPyZIhm4RvqGgwbU0DFEPw5kY/export?format=csv&gid=694267279";
        const GID_GRUPOS = "1077825485"; 
        const URL_GRUPOS = "https://docs.google.com/spreadsheets/d/1kz185SYCWeIEcJhWMWcPyZIhm4RvqGgwbU0DFEPw5kY/export?format=csv&gid=" + GID_GRUPOS;

        let listaGruposWhats = []; 

        window.abrirPopupGrupos = function() {
            document.getElementById('popupGrupos').style.display = 'flex';
            carregarGruposDaPlanilha(); 
        };

        window.fecharPopupGrupos = function() {
            document.getElementById('popupGrupos').style.display = 'none';
        };

        // Função para ler o CSV da planilha
        function parseCSV(text){
            const rows = [];
            let row = [];
            let field = '';
            let inQuotes = false;
            let i = 0;
            while(i < text.length){
                const c = text[i];
                if(inQuotes){
                    if(c === '"'){
                        if(text[i+1] === '"'){ field += '"'; i += 2; continue; }
                        else{ inQuotes = false; i++; continue; }
                    }else{ field += c; i++; continue; }
                }else{
                    if(c === '"'){ inQuotes = true; i++; continue; }
                    if(c === ','){ row.push(field); field = ''; i++; continue; }
                    if(c === '\r'){ i++; continue; }
                    if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
                    field += c; i++;
                }
            }
            if(field.length > 0 || row.length > 0){ row.push(field); rows.push(row); }
            return rows;
        }

        // Função para evitar que códigos HTML na planilha quebrem a página
        function escapeHtml(s){
            return (s||"").toString()
                .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
                .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
        }

        async function carregarGruposDaPlanilha() {
            const container = document.getElementById('listaGruposContainer');
            
            if (listaGruposWhats.length > 0) return; 
            
            try {
                const resp = await fetch(URL_GRUPOS, {cache: "no-store"});
                if(!resp.ok) throw new Error("Erro HTTP " + resp.status);
                const texto = await resp.text();
                const linhas = parseCSV(texto);
                
                listaGruposWhats = []; 
                
                for(let i = 1; i < linhas.length; i++) {
                    const l = linhas[i];
                    if(!l || l.length < 3) continue;
                    const nome = (l[0] || "").trim();
                    const desc = (l[1] || "").trim();
                    const link = (l[2] || "").trim();
                    
                    if(nome && link && link.startsWith("http")) {
                        listaGruposWhats.push({ nome, desc, link });
                    }
                }
                
                if(listaGruposWhats.length === 0) {
                    container.innerHTML = '<div style="text-align:center; padding: 20px; color: #888;">Nenhum grupo cadastrado na planilha.</div>';
                    return;
                }
                
                container.innerHTML = listaGruposWhats.map((g, index) => `
                    <label style="display: flex; align-items: center; padding: 14px; background: #fff; border: 1px solid #eaeaea; border-radius: 14px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 6px rgba(0,0,0,0.02);" onmouseover="this.style.borderColor='#25D366'; this.style.background='#f0fdf4'" onmouseout="this.style.borderColor='#eaeaea'; this.style.background='#fff'">
                        <input type="radio" name="grupo-whats" class="chk-grupo" value="${index}" style="width: 20px; height: 20px; accent-color: #25D366; margin-right: 14px; cursor: pointer; appearance: auto; -webkit-appearance: radio;" onchange="atualizarBotaoConfirmar()">
                        <div style="flex: 1;">
                            <div style="font-weight: 700; font-size: 15px; color: #222;">${escapeHtml(g.nome)}</div>
                            ${g.desc ? `<div style="font-size: 12px; color: #777; margin-top: 2px;">${escapeHtml(g.desc)}</div>` : ''}
                        </div>
                    </label>
                `).join('');
                
            } catch(e) {
                console.error("Erro ao carregar grupos:", e);
                container.innerHTML = '<div style="text-align:center; padding: 20px; color: #c00;">Erro ao carregar grupos.</div>';
            }
        }

        window.atualizarBotaoConfirmar = function() {
            const checkboxes = document.querySelectorAll('.chk-grupo:checked');
            const btn = document.getElementById('btnConfirmar');
            
            if(checkboxes.length > 0) {
                btn.disabled = false;
                btn.style.background = '#25D366'; 
                btn.style.cursor = 'pointer';
            } else {
                btn.disabled = true;
                btn.style.background = '#ccc';    
                btn.style.cursor = 'default';
            }
        };

        window.confirmarGrupos = function() {
            const checkboxes = document.querySelectorAll('.chk-grupo:checked');
            
            checkboxes.forEach(function(chk) {
                const index = parseInt(chk.value, 10);
                const grupo = listaGruposWhats[index];
                if(grupo && grupo.link) {
                    window.open(grupo.link, '_blank');
                }
            });
            
            fecharPopupGrupos();
        };
    </script>
</body>
