<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Achadinhos | Links</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', Arial, sans-serif;
        }

        /* AQUI VOCÊ COLOCA O FUNDO */
        body {
            /* Troque 'fundo.jpg' pelo nome exato da sua imagem */
            background-image: url('fundo.jpg'); 
            background-size: cover;
            background-position: top center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container-botoes {
            width: 100%;
            max-width: 500px; /* Largura máxima dos botões */
            display: flex;
            flex-direction: column;
            gap: 15px; /* Espaço entre os botões */
            margin-top: 65vh; /* Empurra os botões para baixo da imagem da mulher */
            padding-bottom: 40px;
        }

        /* ESTILO DOS BOTÕES */
        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.95); /* Fundo branco levemente transparente */
            border: 2px solid #eaeaea;
            border-radius: 50px; /* Bordas bem arredondadas */
            padding: 10px 20px 10px 10px;
            text-decoration: none;
            color: #333;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.3);
        }

        .btn-icone {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: #25D366; /* Cor padrão (WhatsApp) */
        }

        .btn-icone svg {
            width: 35px;
            height: 35px;
            fill: #fff;
        }

        .btn-texto {
            flex: 1;
            padding: 0 15px;
            text-align: left;
            line-height: 1.3;
        }

        .btn-texto strong {
            display: block;
            font-size: 18px;
            font-weight: 800;
            color: #111;
        }
        
        .btn-texto strong span {
            color: #25D366; /* Destaque verde no texto do WhatsApp */
        }

        .btn-texto small {
            font-size: 13px;
            color: #666;
            font-weight: 500;
        }

        .btn-seta {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #25D366;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .btn-seta svg {
            width: 18px;
            height: 18px;
            fill: #fff;
        }

        /* CORES PERSONALIZADAS PARA CADA BOTÃO */
        
        /* Instagram */
        .btn.instagram .btn-icone {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }
        .btn.instagram .btn-texto strong span {
            color: #dc2743;
        }
        .btn.instagram .btn-seta {
            background: #dc2743;
        }

        /* Site */
        .btn.site .btn-icone {
            background: #111;
        }
        .btn.site .btn-texto strong span {
            color: #ff6b00;
        }
        .btn.site .btn-seta {
            background: #ff6b00;
        }

        /* Ajuste para telas menores */
        @media (max-width: 480px) {
            .container-botoes {
                margin-top: 55vh; /* Ajuste a altura para os botões não cobrirem o rosto */
            }
            .btn-texto strong { font-size: 16px; }
            .btn-texto small { font-size: 11px; }
            .btn-icone { width: 50px; height: 50px; }
            .btn-icone svg { width: 28px; height: 28px; }
        }
    </style>
</head>
<body>
