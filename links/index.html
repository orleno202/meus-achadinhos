<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meus Achadinhos | Links</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', Arial, sans-serif;
        }

        /* Fundo escuro para a tela do PC */
        body {
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
        }

        /* CAIXA QUE MANTÉM A PROPORÇÃO EXATA DA IMAGEM (9:16) */
        .moldura-celular {
            position: relative;
            width: 100vw;
            height: 100vh;
            
            /* Se a tela for muito larga (PC/Tablet), limita a largura e calcula a altura */
            max-width: calc(100vh * (9 / 16));
            max-height: calc(100vw * (16 / 9));
            
            /* No PC, coloca bordas arredondadas e sombra */
            @media (min-width: 768px) {
                border-radius: 20px;
                box-shadow: 0 20px 50px rgba(0,0,0,0.8);
                width: 100%;
                height: 100%;
            }
        }

        /* A IMAGEM DE FUNDO */
        .fundo-imagem {
            position: absolute;
            inset: 0;
            background-image: url('fundo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
        }

        /* O CONTAINER DOS BOTÕES */
        .container-botoes {
            position: absolute;
            /* Distância da borda de baixo da imagem */
            bottom: 22%; 
            left: 50%;
            transform: translateX(-50%); /* Centraliza horizontalmente */
            
            width: 88%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }

        /* ESTILO DOS BOTÕES */
        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #eaeaea;
            border-radius: 50px;
            padding: 8px 14px 8px 8px;
            text-decoration: none;
            color: #333;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .btn:active { transform: scale(0.97); }

        .btn-icone {
            width: 46px; height: 46px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; background: #25D366;
        }
        .btn-icone svg { width: 24px; height: 24px; fill: #fff; }

        .btn-texto {
            flex: 1; padding: 0 10px; text-align: left; line-height: 1.2;
        }
        .btn-texto strong {
            display: block; font-size: 14px; font-weight: 800; color: #111;
        }
        .btn-texto strong span { color: #25D366; }
        .btn-texto small {
            font-size: 10px; color: #666; font-weight: 500;
        }

        .btn-seta {
            width: 28px; height: 28px; border-radius: 50%;
            background: #25D366;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .btn-seta svg { width: 14px; height: 14px; fill: #fff; }

        /* CORES */
        .btn.instagram .btn-icone { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .btn.instagram .btn-texto strong span { color: #dc2743; }
        .btn.instagram .btn-seta { background: #dc2743; }

        .btn.site .btn-icone { background: #111; }
        .btn.site .btn-texto strong span { color: #ff6b00; }
        .btn.site .btn-seta { background: #ff6b00; }

        /* POPUP */
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

                    <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
                </div>
                <div class="btn-texto">
                    <strong>Siga nosso<br><span>Instagram</span></strong>
                    <small>Fique por dentro das novidades!</small>
                </div>
                <div class="btn-seta">
                    <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                </div>
            </a>

                                    <!-- BOTÃO SITE COM O LOGO (FAVICON) -->
            <a href="https://meusachadinhos.qd.je/" class="btn site">
                <div class="btn-icone" style="background: #ff6b00; overflow: hidden; position: relative;">
                    <!-- Círculo branco interno e a imagem por cima -->
                    <div style="position: absolute; inset: 3px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                        <img src="../logo.png" alt="Meus Achadinhos" style="width: 80%; height: 80%; object-fit: contain;">
                    </div>
                </div>
                <div class="btn-texto">
                    <strong>Visite nosso Site<br><span style="color: #ff6b00;">MeusAchadinhos.qd.je</span></strong>
                    <small>Aqui você encontra as melhores ofertas!</small>
                </div>
                <div class="btn-seta" style="background: #ff6b00;">
                    <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                </div>
            </a>

        </div>
    </div>

    <!-- POPUP DE GRUPOS -->
    <div id="popupGrupos" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 99999; align-items: center; justify-content: center; backdrop-filter: blur(5px); padding: 15px; font-family: 'Inter', Arial, sans-serif;">
        <div style="background: #fff; width: 100%; max-width: 420px; border-radius: 24px; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.3); animation: slideUp 0.3s ease; display: flex; flex-direction: column; max-height: 90vh;">
            
            <div style="background: linear-gradient(135deg, #25D366, #1FA855); padding: 25px 20px; text-align: center; position: relative; flex-shrink: 0;">

                <svg xmlns="http://www.w3.org/2000/svg" width="55" height="55" viewBox="0 0 24 24" fill="#fff" style="margin-bottom: 10px; pointer-events: none;">

                <button onclick="confirmarGrupos()" id="btnConfirmar" disabled style="flex: 2; background: #ccc; color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; transition: background 0.2s;">Confirmar</button>

    <!-- SCRIPT DA PLANILHA -->
    <script>
        const URL_PLANILHA = "https://docs.google.com/spreadsheets/d/1kz185SYCWeIEcJhWMWcPyZIhm4RvqGgwbU0DFEPw5kY/export?format=csv&gid=694267279";
        const GID_GRUPOS = "1077825485"; 
        const URL_GRUPOS = "https://docs.google.com/spreadsheets/d/1kz185SYCWeIEcJhWMWcPyZIhm4RvqGgwbU0DFEPw5kY/export?format=csv&gid=" + GID_GRUPOS;

        let listaGruposWhats = []; 

        window.abrirPopupGrupos = function() {
            document.getElementById('popupGrupos').style.display = 'flex';
            carregarGruposDaPlanilha(); 
        };

        window.fecharPopupGrupos = function() {
            document.getElementById('popupGrupos').style.display = 'none';
        };

        function parseCSV(text){
            const rows = [];
            let row = [];
            let field = '';
            let inQuotes = false;
            let i = 0;
            while(i < text.length){
                const c = text[i];
                if(inQuotes){
                    if(c === '"'){
                        if(text[i+1] === '"'){ field += '"'; i += 2; continue; }
                        else{ inQuotes = false; i++; continue; }
                    }else{ field += c; i++; continue; }
                }else{
                    if(c === '"'){ inQuotes = true; i++; continue; }
                    if(c === ','){ row.push(field); field = ''; i++; continue; }
                    if(c === '\r'){ i++; continue; }
                    if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
                    field += c; i++;
                }
            }
            if(field.length > 0 || row.length > 0){ row.push(field); rows.push(row); }
            return rows;
        }

        function escapeHtml(s){
            return (s||"").toString()
                .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
                .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
        }

        async function carregarGruposDaPlanilha() {
            const container = document.getElementById('listaGruposContainer');
            
            if (listaGruposWhats.length > 0) return; 
            
            try {
                const resp = await fetch(URL_GRUPOS, {cache: "no-store"});
                if(!resp.ok) throw new Error("Erro HTTP " + resp.status);
                const texto = await resp.text();
                const linhas = parseCSV(texto);
                
                listaGruposWhats = []; 
                
                for(let i = 1; i < linhas.length; i++) {
                    const l = linhas[i];
                    if(!l || l.length < 3) continue;
                    const nome = (l[0] || "").trim();
                    const desc = (l[1] || "").trim();
                    const link = (l[2] || "").trim();
                    
                    if(nome && link && link.startsWith("http")) {
                        listaGruposWhats.push({ nome, desc, link });
                    }
                }
                
                if(listaGruposWhats.length === 0) {
                    container.innerHTML = '<div style="text-align:center; padding: 20px; color: #888;">Nenhum grupo cadastrado na planilha.</div>';
                    return;
                }
                
                container.innerHTML = listaGruposWhats.map((g, index) => `
                    <label style="display: flex; align-items: center; padding: 14px; background: #fff; border: 1px solid #eaeaea; border-radius: 14px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 6px rgba(0,0,0,0.02);" onmouseover="this.style.borderColor='#25D366'; this.style.background='#f0fdf4'" onmouseout="this.style.borderColor='#eaeaea'; this.style.background='#fff'">
                        <input type="radio" name="grupo-whats" class="chk-grupo" value="${index}" style="width: 20px; height: 20px; accent-color: #25D366; margin-right: 14px; cursor: pointer; appearance: auto; -webkit-appearance: radio;" onchange="atualizarBotaoConfirmar()">
                        <div style="flex: 1;">
                            <div style="font-weight: 700; font-size: 15px; color: #222;">${escapeHtml(g.nome)}</div>
                            ${g.desc ? `<div style="font-size: 12px; color: #777; margin-top: 2px;">${escapeHtml(g.desc)}</div>` : ''}
                        </div>
                    </label>
                `).join('');
                
            } catch(e) {
                console.error("Erro ao carregar grupos:", e);
                container.innerHTML = '<div style="text-align:center; padding: 20px; color: #c00;">Erro ao carregar grupos.</div>';
            }
        }

        window.atualizarBotaoConfirmar = function() {
            const checkboxes = document.querySelectorAll('.chk-grupo:checked');
            const btn = document.getElementById('btnConfirmar');
            
            if(checkboxes.length > 0) {
                btn.disabled = false;
                btn.style.background = '#25D366'; 
                btn.style.cursor = 'pointer';
            } else {
                btn.disabled = true;
                btn.style.background = '#ccc';    
                btn.style.cursor = 'default';
            }
        };

        window.confirmarGrupos = function() {
            const checkboxes = document.querySelectorAll('.chk-grupo:checked');
            
            checkboxes.forEach(function(chk) {
                const index = parseInt(chk.value, 10);
                const grupo = listaGruposWhats[index];
                if(grupo && grupo.link) {
                    window.open(grupo.link, '_blank');
                }
            });
            
            fecharPopupGrupos();
        };
    </script>
</body>
